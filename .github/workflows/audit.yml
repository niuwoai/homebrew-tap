name: Audit Homebrew packages

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit formula and casks
        run: |
          brew audit --new --formula willdeep-cli
          brew audit --new --cask willdeep timebill qeditor gitwise qmarkview qecho qmailmate qterm
          brew style Formula/willdeep-cli.rb Casks/*.rb
